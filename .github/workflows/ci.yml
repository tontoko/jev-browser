name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }} / ${{ matrix.browser }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, node: '22', browser: chromium }
          - { os: ubuntu-24.04, node: '24', browser: chromium }
          - { os: ubuntu-24.04, node: '24', browser: firefox }
          - { os: ubuntu-24.04, node: '24', browser: webkit }
          - { os: macos-latest, node: '24', browser: chromium }
          - { os: windows-latest, node: '24', browser: chromium }
    env:
      JEV_BROWSER: ${{ matrix.browser }}
      JEV_API_KEY: ''
      TYPESAFE_API_KEY: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium ${{ matrix.browser }}
      - run: npm run check
      - run: npm run check:examples
      - run: npm run check:package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: success()
        with:
          name: package-${{ matrix.os }}-node${{ matrix.node }}-${{ matrix.browser }}
          path: '*.tgz'
          if-no-files-found: error
          retention-days: 7
  release:
    name: Publish tested package on a main version change
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select a new release version
        id: version
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, appendFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const before = JSON.parse(execFileSync('git', ['show', `${process.env.BEFORE}:package.json`], { encoding: 'utf8' }));
          assert.equal(pkg.name, '@tontoko/jev-browser');
          assert.match(pkg.version, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/);
          assert.equal(lock.version, pkg.version);
          assert.equal(lock.packages[''].version, pkg.version);
          const changed = before.version !== pkg.version;
          if (changed) readFileSync(`docs/releases/${pkg.version}.md`, 'utf8');
          appendFileSync(process.env.GITHUB_OUTPUT, `changed=${changed}\nversion=${pkg.version}\n`);
          NODE
      - name: Publish the existing verified artifact
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name package-ubuntu-24.04-node24-chromium --dir release-assets
          archive="tontoko-jev-browser-$VERSION.tgz"
          tar -xOf "release-assets/$archive" package/package.json > release-package.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          assert.deepEqual(JSON.parse(readFileSync('release-package.json', 'utf8')), JSON.parse(readFileSync('package.json', 'utf8')));
          NODE
          (cd release-assets && sha256sum "$archive" > SHA256SUMS)
          cp "docs/releases/$VERSION.md" release-notes.md
          printf '\nSource: `%s`\n\nVerification: https://github.com/%s/actions/runs/%s\n' \
            "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> release-notes.md
          tag="v$VERSION"
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA"
          gh release create "$tag" "release-assets/$archive" release-assets/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$tag" --notes-file release-notes.md
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
